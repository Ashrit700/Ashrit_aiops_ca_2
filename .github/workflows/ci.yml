name: FastAPI MLOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-dockerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest (Test FastAPI & Model Prediction)
        run: |
          pytest -v

      - name: Build Docker Image
        run: |
          docker build -t ca_2:latest .

      - name: Run Docker Container & Test Live Endpoints
        run: |
          docker run -d -p 8000:8000 --name sleep-api-test ca_2:latest
          sleep 5
          curl --fail -X GET "http://localhost:8000/"
          curl --fail -X POST "http://localhost:8000/predict" \
               -H "Content-Type: application/json" \
               -d '{"body_weight": 3.385, "brain_weight": 44.5, "max_life_span": 14.0, "gestation_time": 60.0, "predation_index": 1, "sleep_exposure_index": 1, "danger_index": 1}'
          docker stop sleep-api-test